version: '3.8'

services:
  # Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ast_leads_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FIREBASE_PROJECT_ID=andhra-soft-tech-lead-finder
      - FIREBASE_STORAGE_BUCKET=andhra-soft-tech-lead-finder.firebasestorage.app
      - SECRET_KEY=dev_secret_key_ast_leads_2026
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend:/app

  # Asynchronous Background Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ast_leads_worker
    restart: unless-stopped
    command: python -m worker.collection_worker
    environment:
      - FIREBASE_PROJECT_ID=andhra-soft-tech-lead-finder
      - WORKER_CONCURRENCY=4
      - BATCH_SIZE=450
    volumes:
      - ./backend:/app

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ast_leads_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
      - VITE_FIREBASE_PROJECT_ID=andhra-soft-tech-lead-finder
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
